<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Language Center</title>
<style>
:root{--navy:#23345d;--gold:#f0ad30;--light:#e9edf3;--green:#218c62;--red:#d94c4c}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--navy);color:white}.app{width:min(1120px,96vw);margin:24px auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand,.clock{border-radius:20px;padding:18px 24px;box-shadow:0 5px 16px #0003}.brand{background:var(--gold);color:var(--navy);text-align:center;min-width:350px}.brand b{font-size:26px}.clock{background:var(--light);color:#111;text-align:center;min-width:350px;font-weight:bold}.toolbar{display:flex;justify-content:flex-end;margin:12px 0}.iconbtn{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:18px;border:1px solid #ffffff44;background:#ffffff12;color:white;border-radius:999px;cursor:pointer;opacity:.62}.iconbtn:hover{opacity:1;background:#ffffff28}.cardrow{display:grid;grid-template-columns:220px 220px 1fr;gap:12px;margin:13px 0}.box{min-height:52px;border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:bold}.gold{background:var(--gold);color:var(--navy)}.light{background:var(--light);color:#283044}.box input,.cell input{width:100%;border:0;outline:0;background:transparent;text-align:center;font:inherit;color:inherit;text-transform:uppercase}.details{display:grid;grid-template-columns:220px 1fr;gap:12px;margin:12px 0}.caption{text-align:left;justify-content:flex-start}.virtual-value-right{text-align:left;justify-content:flex-start;padding-left:22px;padding-right:14px}.tutorial-head,.tutorial-row{display:grid;grid-template-columns:150px 1.5fr 130px 120px 120px 160px 72px;gap:8px;align-items:center;text-align:center}.tutorial-head{color:var(--gold);font-weight:bold;padding:10px 8px}.tutorial-row{background:var(--light);color:#283044;padding:9px;border-radius:13px;margin-bottom:9px;min-height:50px}.round{border:0;width:27px;height:27px;border-radius:50%;color:white;cursor:pointer;font-weight:bold}.plus{background:var(--green)}.minus{background:var(--red)}.hidden{display:none!important}@media(max-width:800px){.top{flex-direction:column}.brand,.clock{min-width:0;width:100%}.cardrow,.details{grid-template-columns:1fr}.tutorial-head{display:none}.tutorial-row{grid-template-columns:1fr 1fr}.tutorial-row>div:nth-child(2),.tutorial-row>div:nth-child(6){grid-column:span 2}.app{margin:12px auto}}@media print{.toolbar,.round{display:none!important}.app{width:100%;margin:0}body{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body><div class="app"><div class="top"><div class="brand"><b>LANGUAGE CENTER</b><br><span id="subtitle">Virtual Class</span></div><div class="clock"><div id="fecha"></div><div id="hora"></div></div></div><div class="toolbar"><button class="iconbtn" id="switchBtn" title="Cambiar portada" aria-label="Cambiar portada">⇄</button></div><div class="cardrow"><div class="box gold">CÓDIGO DOCENTE</div><div class="box light"><input id="teacherCode" autocomplete="off" placeholder="Escriba el código"></div><div class="box gold" id="teacherName"></div></div><section id="virtual"><div class="cardrow subject-row"><div class="box light caption">CÓDIGO ASIGNATURA:</div><div class="box light"><input id="subjectCode" autocomplete="off" placeholder="Escriba el código"></div><div class="box light" id="vName"></div></div><div class="details"><div class="box light caption">CARRERA:</div><div class="box light virtual-value-right" id="vCareer"></div></div><div class="details"><div class="box light caption">HORARIO:</div><div class="box light virtual-value-right" id="vSchedule"></div></div><div class="details"><div class="box light caption">NIVEL:</div><div class="box light virtual-value-right" id="vLevel"></div></div><div class="details"><div class="box light caption">MODALIDAD:</div><div class="box light virtual-value-right" id="vMode"></div></div><div class="details"><div class="box light caption">JORNADA:</div><div class="box light virtual-value-right" id="vShift"></div></div></section><section id="tutorial" class="hidden"><div class="tutorial-head"><div>CÓDIGO</div><div>ASIGNATURA</div><div>HORARIO</div><div>MODALIDAD</div><div>JORNADA</div><div>CARRERA</div><div></div></div><div id="rows"></div></section></div><script id="embeddedData" type="application/json">{"docentes":[{"codigo":"RIQUI","nombre":"QUISHPE SATAN RICARDO ARTURO"},{"codigo":"JORGEGA","nombre":"GAVILÁNEZ CONGACHA JORGE LUIS"},{"codigo":"JETO","nombre":"TOALOMBO PILLAJO JESSICA TATIANA"},{"codigo":"KASAN","nombre":"SANGOLUISA TAPIA KATHERINE ALEXANDRA"},{"codigo":"MAAR","nombre":"ARCOS HERMOSA MAYRA ELIZABETH"},{"codigo":"BRYCA","nombre":"CAIZA PILAMUNGA BRYAN BOLIVAR"},{"codigo":"DEMO","nombre":"MONTUFAR PADILLA DENNIS SANTIAGO"},{"codigo":"JOPA","nombre":"PAZMIÑO CARRION JONATHAN ISMAEL"}],"asignaturas":[{"codigo":"2626CI1301","asignatura":"ENGLISH I","horario":"12:30-14:30","nivel":"FIRST","modalidad":"ON-SITE","jornada":"AFTERNOON"},{"codigo":"2626CI1391","asignatura":"ENGLISH II","horario":"12:30-14:30","nivel":"","modalidad":"ON-SITE","jornada":"AFTERNOON"},{"codigo":"2626CI1401","asignatura":"ENGLISH II","horario":"12:30-14:30","nivel":"","modalidad":"ON-SITE","jornada":"AFTERNOON"},{"codigo":"2626CI1451","asignatura":"ENGLISH III","horario":"12:30-14:30","nivel":"","modalidad":"ON-SITE","jornada":"AFTERNOON"},{"codigo":"2626CI1511","asignatura":"ENGLISH IV","horario":"12:30-14:30","nivel":"","modalidad":"ON-SITE","jornada":"AFTERNOON"},{"codigo":"2626CI1611","asignatura":"ENGLISH I","horario":"08:00-15:00","nivel":"FIRST","modalidad":"ON-SITE","jornada":"SATURDAYS"},{"codigo":"2626CI1631","asignatura":"ENGLISH I","horario":"15:00-22:00","nivel":"FIRST","modalidad":"ONLINE","jornada":"SATURDAYS"},{"codigo":"2626CI1661","asignatura":"ENGLISH II","horario":"08:00-15:00","nivel":"SECOND","modalidad":"ON-SITE","jornada":"SATURDAYS"},{"codigo":"2626CI1691","asignatura":"ENGLISH II","horario":"15:00-22:00","nivel":"SECOND","modalidad":"ONLINE","jornada":"SATURDAYS"},{"codigo":"2626CI1751","asignatura":"ENGLISH III","horario":"15:00-22:00","nivel":"THIRD","modalidad":"ONLINE","jornada":"SATURDAYS"},{"codigo":"2626CI1781","asignatura":"ENGLISH IV","horario":"08:00-15:00","nivel":"FOURTH","modalidad":"ON-SITE","jornada":"SATURDAYS"},{"codigo":"2626CI2021","asignatura":"ENGLISH IV","horario":"21:00-22:00","nivel":"FOURTH","modalidad":"HYBRID","jornada":"NIGHT"},{"codigo":"2626CI2081","asignatura":"ENGLISH I","horario":"18:00-21:30","nivel":"FIRST","modalidad":"ONLINE","jornada":"NIGHT"},{"codigo":"2626CI2111","asignatura":"ENGLISH I","horario":"18:00-21:30","nivel":"FIRST","modalidad":"ONLINE","jornada":"NIGHT"},{"codigo":"2626CI2141","asignatura":"ENGLISH II","horario":"18:00-21:30","nivel":"SECOND","modalidad":"ONLINE","jornada":"NIGHT"},{"codigo":"2626CI2171","asignatura":"ENGLISH II","horario":"18:00-21:30","nivel":"SECOND","modalidad":"ONLINE","jornada":"NIGHT"},{"codigo":"2626CI2231","asignatura":"ENGLISH III","horario":"18:00-21:30","nivel":"THIRD","modalidad":"ONLINE","jornada":"NIGHT"},{"codigo":"2626CI2261","asignatura":"ENGLISH IV","horario":"18:00-21:30","nivel":"FOURTH","modalidad":"ONLINE","jornada":"NIGHT"},{"codigo":"2626CI2291","asignatura":"ENGLISH IV","horario":"18:00-21:30","nivel":"FOURTH","modalidad":"ONLINE","jornada":"NIGHT"},{"codigo":"2626CI2661","asignatura":"ENGLISH III (Accelerated)","horario":"18:00-22:00","nivel":"THIRD","modalidad":"ONLINE","jornada":"ACCELERATED"},{"codigo":"2626CI2671","asignatura":"ENGLISH IV (Accelerated)","horario":"18:00-22:00","nivel":"FOURTH","modalidad":"ONLINE","jornada":"ACCELERATED"},{"codigo":"2626CI2082","asignatura":"ENGLISH I","horario":"18:00-21:30","nivel":"FIRST","modalidad":"ONLINE","jornada":"NIGHT"},{"codigo":"2626CI2142","asignatura":"ENGLISH II","horario":"18:00-21:30","nivel":"SECOND","modalidad":"ONLINE","jornada":"NIGHT"},{"codigo":"2626CI2232","asignatura":"ENGLISH III","horario":"18:00-21:30","nivel":"THIRD","modalidad":"ONLINE","jornada":"NIGHT"},{"codigo":"2626CI2262","asignatura":"ENGLISH IV","horario":"18:00-21:30","nivel":"FOURTH","modalidad":"ONLINE","jornada":"NIGHT"}]}</script><script>
const db=JSON.parse(document.getElementById('embeddedData').textContent),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let view='virtual';const norm=s=>String(s||'').trim().toUpperCase();function ordinal(d){if(d%100>=11&&d%100<=13)return d+'TH';switch(d%10){case 1:return d+'ST';case 2:return d+'ND';case 3:return d+'RD';default:return d+'TH'}}function clock(){const n=new Date(),day=n.toLocaleDateString('en-US',{weekday:'long'}).toUpperCase(),month=n.toLocaleDateString('en-US',{month:'long'}).toUpperCase();$('#fecha').textContent=day+', '+month+' '+ordinal(n.getDate())+' '+n.getFullYear();$('#hora').textContent='TIME: '+n.toLocaleTimeString('en-US')}clock();function teacher(c){return db.docentes.find(x=>norm(x.codigo)===norm(c))}function subject(c){return db.asignaturas.find(x=>norm(x.codigo)===norm(c))}$('#teacherCode').oninput=()=>{let d=teacher($('#teacherCode').value);$('#teacherName').textContent=d?d.nombre:''};$('#subjectCode').oninput=()=>{let a=subject($('#subjectCode').value),ids=['#vName','#vCareer','#vSchedule','#vLevel','#vMode','#vShift'];if(!a){ids.forEach(x=>$(x).textContent='');return}$('#vName').textContent=a.asignatura;$('#vCareer').textContent='LANGUAGE CENTER';$('#vSchedule').textContent=(a.modalidad==='HYBRID'&&new Date().getDay()===6)?'19:00 - 21:00':a.horario;$('#vLevel').textContent=a.nivel;$('#vMode').textContent=a.modalidad;$('#vShift').textContent=a.jornada};function fillRow(r){let a=subject(r.querySelector('input').value);['asig','hor','mod','jor','car'].forEach(c=>r.querySelector('.'+c).textContent='');if(a){r.querySelector('.asig').textContent=a.asignatura;r.querySelector('.hor').textContent=a.horario;r.querySelector('.mod').textContent=a.modalidad;r.querySelector('.jor').textContent=a.jornada;r.querySelector('.car').textContent='LANGUAGE CENTER'}}function createRow(){let r=document.createElement('div');r.className='tutorial-row';r.innerHTML='<div class="cell"><input placeholder="CÓDIGO"></div><div class="asig"></div><div class="hor"></div><div class="mod"></div><div class="jor"></div><div class="car"></div><div><button class="round plus">+</button> <button class="round minus">−</button></div>';r.querySelector('input').oninput=()=>fillRow(r);r.querySelector('.plus').onclick=createRow;r.querySelector('.minus').onclick=()=>{r.remove();if(!$('#rows').children.length)createRow()};$('#rows').appendChild(r)}createRow();$('#switchBtn').onclick=()=>{view=view==='virtual'?'tutorial':'virtual';$('#virtual').classList.toggle('hidden',view!=='virtual');$('#tutorial').classList.toggle('hidden',view!=='tutorial');$('#subtitle').textContent=view==='virtual'?'Virtual Class':'Tutorial Action';$('#switchBtn').title=view==='virtual'?'Cambiar a Tutorial Action':'Cambiar a Virtual Class';$('#switchBtn').setAttribute('aria-label',$('#switchBtn').title)};
</script></body></html>
